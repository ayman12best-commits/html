<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolling dice</title>
    <style>
        #dice {
            font-size: 300px;
            color: aqua;
        }
        #dice:hover{
            cursor:pointer;
        }
    </style>
</head>
<body>
    <h1>Rolling random numbers</h1>
    <h3>Click on the nuumber to start and stop</h3>
    <div id = "dice" onclick = "startstop()"></div>
    <script>
        var stopped = true
        var dices = ['&#9856','&#9857','&#9858','&#9859','&#9860','&#9861']
        var interval
        var dice = document.getElementById("dice")
        function change(){
            var r = Math.floor(Math.random()*100)
            dice.innerHTML = r
        }
        function startstop(){
            if (stopped){
                stopped = false
                interval = setInterval(change,100)
            }
            else{
                stopped = true
                clearInterval(interval)
            }
        }
        window.onload = function(){
            startstop()
        }
    </script>
</body>
</html>
