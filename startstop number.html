<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
</head>
<body>
    <h1>Stopwatch</h1>
    <div id = "wrapper">
    <span id = "number">00</span></span><br>
    <button id = "buttonstart">start</button>
    <button id = "buttonstop">stop</button>
    <button id = "buttonreset">reset</button>
    </div>
    <script>
        window.onload = function(){
            var number = 0
            var milliseconds = 0
            var appendmilliseconds = document.getElementById("millisec")
            var appendseconds = document.getElementById("sec")
            var bstart = document.getElementById("buttonstart")
            var bstop = document.getElementById("buttonstop")
            var breset = document.getElementById("buttonreset")
            var interval
            bstart.onclick = function(){
                clearInterval(interval)
                 interval = setInterval(starttimer,10)
            }
            bstop.onclick = function(){
                clearInterval(interval)
            }
            breset.onclick = function(){
                clearInterval(interval)
                number = 0
                appendnumber.innerHTML = number;
            }
            function starttimer()
            {
                number++
                appendnumber.innerHTML = number
            }
        }
    </script>
</body>
</html>
