<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palidrome</title>
    <style>
        body{
            background-color: black;
            color: orangered;
            text-align: center;
            font-size: 40px;
        }
    </style>
</head>
<body>
    <h1>Palidrome</h1>
    <div id = "result"></div>
    <script>
        function palidrome(string1){
            var input = string1.replace(/[^a-z,0-9]/ig,"").toLowerCase()
            var revinput = input.split("").reverse().join("")
            if (input == revinput){
                document.getElementById("result").innerHTML = string1 + "is a palidrome"
            }
            else{
                document.getElementById("result").innerHTML = string1 + "is not a palidrome"
            }
        }
        palidrome("racecar")
    </script>
</body>
</html>
